syntax = "proto3";
package svg_builder;

// Every zero value is the default, so `{}` is a complete config.
message Parameters {
  uint32     seed       = 1;  // geometry depends on this and nothing else
  Output     output     = 2;  // unset -> ./out at 1080p
  Background background = 3;  // unset -> plain lattice, no animation
  Icon       icon       = 4;  // unset -> hexatri, rotating
  Overlay    overlay    = 5;  // unset -> nothing above the lattice
  Zine       zine       = 6;  // read by every zine item in the scene; inert without one
}

message Zine { string spot = 1; }  // #rrggbb, no alpha (a print ink); empty = #e63946

message Output {
  oneof sink {
    File      file      = 1;
    Stdout    stdout    = 2;
    Directory directory = 3;
  }
}
message File      { string path = 1; string resolution = 2; }
message Stdout    { string resolution = 1; }
message Directory { string path = 1; repeated string resolutions = 2; }
// resolution: a preset (720p 1080p 1440p 4k mobile tablet square ultrawide)
// or WIDTHxHEIGHT. Empty = 1080p.

message Background {
  oneof ground {  // unset -> trihex defaults
    Trihex trihex = 1;
    Summit summit = 2;
    Treeline treeline = 3;
    Halfpipe halfpipe = 4;
  }
}
// motion and image are independent; CLOSEOPEN + NONE is rejected in validate().
message Trihex {
  enum Motion { STATIC = 0; SCAN = 1; LIGHTS = 2; CLOSEOPEN = 3; }
  enum Image  { NONE = 0; STARFIELD = 1; }
  Motion motion = 1;
  Image  image  = 2;
}
enum Snow { FLURRY = 0; NO_SNOW = 1; BLIZZARD = 2; }  // zero = the approved look
message Summit { Snow snow = 1; }
message Treeline { Snow snow = 1; }
message Halfpipe { Snow snow = 1; }

message Icon {
  oneof glyph {
    Hexatri hexatri = 1;
    Ship    ship    = 2;
    Punk    punk    = 3;
    Park    park    = 4;
  }
}
message Hexatri {
  enum Motion { ROTATE = 0; STATIC = 1; }   // zero = the old default
  Motion motion = 1;
}
message Ship {}

// Shared by every zine head: the gear spinning behind it, and the beat the head moves to.
message Rider {
  enum Gear { BOARD = 0; CROSSED_SKIS = 1; }
  enum Motion { STILL = 0; BOB = 1; SWAY = 2; }  // the head only, never the gear
  Gear gear = 1;
  bool counter_clockwise = 2;    // inert when spin_rpm is 0
  optional uint32 spin_rpm = 3;  // turns a minute, 0-30; unset = 8, 0 = still
  Motion motion = 4;
  uint32 bpm = 5;                // 40-200; 0 = 96; inert when no head animation is on
}
message Punk {
  enum Eyes { STILL = 0; POP = 1; }
  Rider rider = 1;
  bool crest_wave = 2;    // each spike rocks on the beat
  bool rainbow_flow = 3;  // the crest colours travel, once every 8 beats
  bool chatter = 4;       // the lower teeth drop every half beat
  Eyes eyes = 5;
}
message Park {
  Rider rider = 1;
  bool pompom = 2;     // the pompom wobbles on every beat
  bool lens_flow = 3;  // the goggle colours travel, once every 8 beats
  bool glint = 4;      // a paper bar crosses the lens every 4 beats
  bool breath = 5;     // three puffs rise from the gaiter every 2 beats
  string beanie = 6;   // #rrggbb; empty = follow zine.spot
}

message Overlay {
  oneof layer { Matrix matrix = 1; }
}
message Matrix {
  double angle = 1;  // 0-360, 0 = falling down, increasing clockwise
  string color = 2;  // #rrggbb or #rrggbbaa; empty = default
}
