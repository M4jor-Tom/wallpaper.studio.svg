<svg xmlns="http://www.w3.org/2000/svg" viewBox="-160 -150 320 300" preserveAspectRatio="xMidYMid slice" class="m-bob c-wave c-flow t-chat e-pop" style="--beat:0.625s"><style>.spin{transform-box:fill-box;transform-origin:center;animation:sp 7.5s linear infinite}.rays2{transform-box:view-box;transform-origin:320px 150px;animation:sp 120s linear infinite}
.spin{transform-box:fill-box;transform-origin:center;animation:sp 7.5s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.rays{transform-box:view-box;transform-origin:320px 190px;animation:sp 120s linear infinite}
.fall{animation:fall 18s linear infinite}@keyframes fall{to{transform:translateY(360px)}}
.hd,.sp,.eye,.lo{transform-box:fill-box}
.m-bob .hd{animation:bob var(--beat) ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
.m-bang .hd{transform-origin:50% 100%;animation:bang var(--beat) cubic-bezier(.2,.8,.3,1) infinite}
@keyframes bang{0%,100%{transform:rotate(0)}14%{transform:rotate(14deg)}48%{transform:rotate(-3deg)}}
.m-sway .hd{transform-origin:50% 100%;animation:sway calc(var(--beat)*2) ease-in-out infinite alternate}
@keyframes sway{from{transform:rotate(-8deg)}to{transform:rotate(8deg)}}
.c-wave .sp{transform-origin:50% 100%;animation:wave var(--beat) ease-in-out infinite;animation-delay:calc(var(--i)*var(--beat)*-.13)}
@keyframes wave{0%,100%{transform:rotate(-7deg)}50%{transform:rotate(7deg)}}
.c-flow .cr{animation:hue calc(var(--beat)*8) linear infinite}
@keyframes hue{to{filter:hue-rotate(360deg)}}
.t-chat .lo{animation:chat calc(var(--beat)/2) steps(2,jump-none) infinite}
@keyframes chat{from{transform:translateY(0)}to{transform:translateY(4px)}}
.e-pop .eye{transform-origin:center;animation:pop calc(var(--beat)*4) ease-out infinite}
@keyframes pop{0%,12%,100%{transform:scale(1)}4%{transform:scale(1.45)}}
.e-twist .eye{transform-origin:center;animation:twist calc(var(--beat)*2) cubic-bezier(.6,0,.2,1) infinite}
@keyframes twist{0%,40%{transform:rotate(0)}50%,90%{transform:rotate(45deg)}100%{transform:rotate(90deg)}}
@media (prefers-reduced-motion:reduce){.spin,.fall,.rays,.hd,.sp,.cr,.lo,.eye{animation:none!important}}









.breath{display:none}
.p-pom .pom{transform-box:fill-box;transform-origin:50% 100%;animation:pom var(--beat) ease-in-out infinite}
@keyframes pom{0%,100%{transform:rotate(-16deg)}50%{transform:rotate(16deg)}}
.p-flow .lens{animation:hue calc(var(--beat)*8) linear infinite}
.gl{opacity:0}
.p-glint .gl,.l-glint .gl{animation:glint calc(var(--beat)*4) ease-in-out infinite}
@keyframes glint{0%,55%{transform:translateX(0);opacity:0}62%{opacity:1}100%{transform:translateX(130px);opacity:0}}
.p-breath .breath,.l-breath .breath{display:inline;animation:puff calc(var(--beat)*2) ease-out infinite}
@keyframes puff{0%{opacity:0;transform:translate(-6px,4px)}30%{opacity:1}100%{opacity:0;transform:translate(10px,-10px)}}
.l-wind .bd{transform-box:fill-box;transform-origin:50% 0;animation:wind calc(var(--beat)*2) ease-in-out infinite alternate}
@keyframes wind{from{transform:skewX(-6deg)}to{transform:skewX(6deg)}}
.fr{transform-box:fill-box;transform-origin:center}
.l-frost .fr{animation:tw calc(var(--beat)*2) ease-in-out infinite;animation-delay:calc(var(--i)*var(--beat)*-.29)}
@keyframes tw{0%,100%{transform:scale(.4);opacity:.4}50%{transform:scale(1.4);opacity:1}}
@media (prefers-reduced-motion:reduce){.pom,.lens,.gl,.breath,.bd,.fr{animation:none!important}}
[data-only]{display:none}

.lock,.stache{transform-box:fill-box}
.l-locks .lock{transform-origin:50% 0;animation:lk var(--beat) ease-in-out infinite;animation-delay:calc(var(--i)*var(--beat)*-.18)}
@keyframes lk{0%,100%{transform:rotate(-9deg)}50%{transform:rotate(9deg)}}
.l-twitch .stache{transform-origin:50% 50%;animation:tw2 calc(var(--beat)*4) ease-in-out infinite}
@keyframes tw2{0%,72%,100%{transform:none}76%{transform:rotate(-7deg) scale(1.08,.9)}81%{transform:rotate(6deg) scale(1.06,.92)}86%{transform:none}}
.drop{opacity:0}
.l-drip .drop{animation:drip calc(var(--beat)*4) ease-in infinite}
@keyframes drip{0%,50%{transform:translateY(0) scale(.2);opacity:0}70%{transform:translateY(0) scale(1);opacity:1}100%{transform:translateY(46px) scale(1);opacity:0}}
@media (prefers-reduced-motion:reduce){.lock,.stache,.drop{animation:none!important}}
</style><defs><filter id="punk-cut" filterUnits="userSpaceOnUse" x="-160" y="-160" width="320" height="320"><feMorphology in="SourceAlpha" operator="dilate" radius="6" result="d"/><feFlood flood-color="#f3efe6"/><feComposite in2="d" operator="in" result="o"/><feDropShadow in="o" dx="4" dy="5" stdDeviation="0" flood-color="#e63946" result="s"/><feMerge><feMergeNode in="s"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs><rect x="-160" y="-150" width="320" height="300" fill="#111114"/><g transform="translate(0,10) scale(1.05)" filter="url(#punk-cut)"><g class="spin"><rect x="-108" y="-21" width="216" height="42" rx="21" fill="#16161a" stroke="#f3efe6" stroke-width="3"/><rect x="-96" y="-3" width="192" height="6" rx="3" fill="#e63946"/><rect x="-86" y="-14" width="22" height="28" rx="5" fill="#f3efe6"/><rect x="64" y="-14" width="22" height="28" rx="5" fill="#f3efe6"/></g><g class="hd"><g class="cr"><g class="sp" style="--i:6"><polygon points="-45.2,-5.9 -24.3,0.2 -30.3,11.7" fill="#c04bff"/><polygon points="-45.2,-5.9 -30.3,11.7 -23.4,23.1 -34.9,23.1" fill="#8a36b8"/></g><g class="sp" style="--i:5"><polygon points="-43.1,-41.5 -20.1,-19.9 -28.7,-9.6" fill="#5b4bff"/><polygon points="-43.1,-41.5 -28.7,-9.6 -24.4,1.7 -35.9,1.7" fill="#4236b8"/></g><g class="sp" style="--i:4"><polygon points="-31.5,-75.5 -11.6,-35.5 -22.4,-27.9" fill="#1e90ff"/><polygon points="-32,-18.6 -31.5,-75.5 -20.6,-18.6" fill="#1668b8"/></g><g class="sp" style="--i:3"><polygon points="-12.4,-40.4 -10.8,-98.4 -0.3,-43.9" fill="#2ed573"/><polygon points="-23.8,-34.6 -10.8,-98.4 -12.3,-34.6" fill="#219953"/></g><g class="sp" style="--i:2"><polygon points="-0.3,-45 14.6,-99 12,-43.9 0.5,-43.9" fill="#ffd400"/><polygon points="-12.7,-43.6 14.6,-99 -0.3,-45 -1.2,-43.6" fill="#b89900"/></g></g><circle cy="8" r="56" fill="#0d0d12"/><g stroke="#fff" stroke-width="6.5" stroke-linecap="round"><g class="eye"><line x1="3" y1="-6.5" x2="20.1" y2="8.5"/><line x1="4.3" y1="8.5" x2="19" y2="-6.5"/></g><g class="eye"><line x1="41.1" y1="-6.5" x2="51" y2="8.5"/><line x1="42.2" y1="8.5" x2="49.7" y2="-6.5"/></g></g><g fill="#fff"><g class="up"><polygon points="-4.4,20.6 6.7,23.3 0.6,25.5"/><polygon points="9.1,24.2 18.7,25.8 11.9,33.6"/><polygon points="20.9,26.3 29.3,26.9 22.1,37.6"/><polygon points="31.2,26.9 38.6,26.3 31.9,37.6"/><polygon points="40.3,25.8 46.5,24.2 41.4,33.6"/><polygon points="48,23.3 52.6,20.6 49.8,25.5"/></g><g class="lo"><polygon points="1.5,27.9 9.6,36.5 7.4,26.5"/><polygon points="11.7,37.7 19.3,42 18.8,30.4"/><polygon points="21.2,42.4 29.1,42.4 29.1,31.7"/><polygon points="31.1,42 39.2,37.7 38.4,30.4"/><polygon points="41.1,36.5 48.7,27.9 46.7,26.5"/></g></g><g class="cr"><g class="sp" style="--i:1"><polygon points="11.7,-40.9 34.2,-72.2 23.2,-35.3 11.8,-35.3" fill="#ff8a1f"/><polygon points="-0.4,-44.2 34.2,-72.2 11.7,-40.9" fill="#b86316"/></g><g class="sp" style="--i:0"><polygon points="20.2,-19.7 21.9,-28.8 40.7,-33 31.6,-19.7" fill="#ff3b3b"/><polygon points="11,-36.2 22.5,-36.2 40.7,-33 21.9,-28.8" fill="#b82a2a"/></g></g></g></g></svg>